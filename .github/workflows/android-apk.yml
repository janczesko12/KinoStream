name: Build, test and publish KinoStream APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Add the free TMDB read-only API key as the TMDB_API_KEY repository Actions secret.
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

concurrency:
  group: kinostream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate TMDB API credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TMDB_API_KEY:-}" ]]; then
            echo "::error::TMDB_API_KEY is missing from repository Actions secrets."
            exit 1
          fi
          response_file="$RUNNER_TEMP/tmdb-validation.json"
          if [[ "$TMDB_API_KEY" == *.*.* ]]; then
            http_code=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
              --header "Authorization: Bearer $TMDB_API_KEY" \
              "https://api.themoviedb.org/3/configuration")
          else
            http_code=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
              --get --data-urlencode "api_key=$TMDB_API_KEY" \
              "https://api.themoviedb.org/3/configuration")
          fi
          if [[ "$http_code" != "200" ]]; then
            echo "::error::TMDB API credential check failed (HTTP $http_code). Check the TMDB_API_KEY secret."
            jq -r '.status_message // empty' "$response_file" 2>/dev/null || true
            exit 1
          fi
          echo "TMDB API credential accepted."
          providers_file="$RUNNER_TEMP/tmdb-providers.json"
          if [[ "$TMDB_API_KEY" == *.*.* ]]; then
            providers_code=$(curl --silent --show-error --output "$providers_file" --write-out "%{http_code}" \
              --header "Authorization: Bearer $TMDB_API_KEY" \
              "https://api.themoviedb.org/3/watch/providers/movie?watch_region=PL&language=pl-PL")
          else
            providers_code=$(curl --silent --show-error --output "$providers_file" --write-out "%{http_code}" \
              --get --data-urlencode "api_key=$TMDB_API_KEY" --data-urlencode "watch_region=PL" \
              "https://api.themoviedb.org/3/watch/providers/movie")
          fi
          if [[ "$providers_code" != "200" ]]; then
            echo "::error::TMDB Polish provider lookup failed (HTTP $providers_code)."
            jq -r '.status_message // empty' "$providers_file" 2>/dev/null || true
            exit 1
          fi
          echo "TMDB providers returned for Poland:"
          jq -r '[.results[].provider_name] | join(", ")' "$providers_file"
          # Validate that the actual discover endpoint returns catalogue rows, not only provider names.
          for provider_label in Netflix Prime Disney SkyShowtime Max; do
            case "$provider_label" in
              Netflix) provider_id=$(jq -r '.results[] | select(.provider_name | ascii_downcase | contains("netflix")) | .provider_id' "$providers_file" | head -n1) ;;
              Prime) provider_id=$(jq -r '.results[] | select(.provider_name | ascii_downcase | contains("amazon prime video")) | .provider_id' "$providers_file" | head -n1) ;;
              Disney) provider_id=$(jq -r '.results[] | select(.provider_name | ascii_downcase | contains("disney plus")) | .provider_id' "$providers_file" | head -n1) ;;
              SkyShowtime) provider_id=$(jq -r '.results[] | select(.provider_name | ascii_downcase | contains("skyshowtime")) | .provider_id' "$providers_file" | head -n1) ;;
              Max) provider_id=$(jq -r '.results[] | select((.provider_name | ascii_downcase | contains("hbo max")) or (.provider_name | ascii_downcase) == "max") | .provider_id' "$providers_file" | head -n1) ;;
            esac
            if [[ -z "${provider_id:-}" || "$provider_id" == "null" ]]; then
              echo "No TMDB provider ID mapped for $provider_label"
              continue
            fi
            for media_type in movie tv; do
              discover_url="https://api.themoviedb.org/3/discover/$media_type?language=pl-PL&region=PL&watch_region=PL&with_watch_providers=$provider_id&with_watch_monetization_types=flatrate%7Cfree%7Cads&include_adult=false&sort_by=popularity.desc&page=1"
              if [[ "$TMDB_API_KEY" == *.*.* ]]; then
                result_json=$(curl --silent --show-error --header "Authorization: Bearer $TMDB_API_KEY" "$discover_url")
              else
                result_json=$(curl --silent --show-error --get --data-urlencode "api_key=$TMDB_API_KEY" "$discover_url")
              fi
              result_count=$(printf '%s' "$result_json" | jq -r '.results | length' 2>/dev/null || echo 0)
              echo "TMDB discover $media_type / $provider_label: $result_count results"
            done
          done

      - name: Configure Firebase Android app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not configured. APK builds, but Firebase reporting will not connect in CI-built APKs."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          jq -e '.project_info.project_id and (.client | length > 0)' app/google-services.json >/dev/null
          package_name=$(jq -r '.client[0].client_info.android_client_info.package_name' app/google-services.json)
          if [[ "$package_name" != "com.aistudio.kinostream.rvpx" ]]; then
            echo "::error::Firebase Android package must be com.aistudio.kinostream.rvpx; found $package_name."
            exit 1
          fi
          echo "Firebase Android configuration verified."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set an increasing CI version
        shell: bash
        run: |
          echo "KINOSTREAM_VERSION_CODE=$(($GITHUB_RUN_NUMBER + 2))" >> "$GITHUB_ENV"
          echo "KINOSTREAM_VERSION_NAME=1.2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      # This key exists only for CI debug builds. It is not a production signing key.
      - name: Generate temporary debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle clean assembleDebug

      - name: Run unit and Robolectric tests
        run: gradle testDebugUnitTest

      - name: Upload debug APK for CI testing only
        uses: actions/upload-artifact@v4
        with:
          name: kinostream-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Prepare website release signing key
        id: signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SIGNING_KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" ]]; then
            echo "release_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release skipped. Configure SIGNING_KEYSTORE_BASE64, STORE_PASSWORD and KEY_PASSWORD to enable updates."
            exit 0
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"
          keytool -list -keystore "$GITHUB_WORKSPACE/release.keystore" -storepass "$STORE_PASSWORD" -alias upload
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> "$GITHUB_ENV"
          echo "release_ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.signing.outputs.release_ready == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload signed APK artifact
        if: steps.signing.outputs.release_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kinostream-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create update manifest with APK checksum
        if: steps.signing.outputs.release_ready == 'true'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          apk = Path("app/build/outputs/apk/release/app-release.apk")
          metadata_path = Path("app/build/outputs/apk/release/output-metadata.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          element = metadata["elements"][0]
          sha256 = hashlib.sha256(apk.read_bytes()).hexdigest()
          commit_message = os.environ.get("COMMIT_MESSAGE", "").strip()
          changelog = next((line.strip() for line in commit_message.splitlines() if line.strip()), "Poprawki i ulepszenia KinoStream")
          manifest = {
              "versionCode": int(element["versionCode"]),
              "versionName": str(element["versionName"]),
              "apkUrl": "https://github.com/janczesko12/KinoStream/releases/download/latest/app-release.apk",
              "sha256": sha256,
              "changelog": changelog[:300],
          }
          Path("update.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

      - name: Remove legacy debug APK from public release
        if: steps.signing.outputs.release_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/latest" --jq '.id' 2>/dev/null || true)"
          if [[ -n "$release_id" ]]; then
            asset_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets" --jq '.[] | select(.name == "app-debug.apk") | .id' | head -n 1)"
            if [[ -n "$asset_id" ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          fi

      - name: Publish latest APK and update manifest
        if: steps.signing.outputs.release_ready == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: KinoStream latest version
          body: |
            Automated build from the main branch.
            The APK and update.json are used by the in-app updater.
          files: |
            app/build/outputs/apk/release/app-release.apk
            update.json
          overwrite_files: true
          fail_on_unmatched_files: true
