name: Build KinoStream APK

on:
  push:
    branches: [main, "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kinostream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and package KinoStream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # CI debug APK is only a build/test artifact; production signing stays in Google AI Studio/Play Console.
      - name: Generate temporary debug keystore
        run: keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        run: gradle clean assembleDebug

      - name: Run unit and Robolectric tests
        run: gradle testDebugUnitTest

      - name: Upload debug APK for CI testing only
        uses: actions/upload-artifact@v4
        with:
          name: kinostream-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
