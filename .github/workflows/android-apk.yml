name: Build KinoStream APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Publish APK as latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH"
          gh release create latest "$APK_PATH#KinoStream.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "KinoStream — najnowsza wersja" \
            --notes "Automatyczna kompilacja z gałęzi main." \
            --latest 2>/dev/null || {
              gh release delete-asset latest KinoStream.apk --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
              gh release upload latest "$APK_PATH#KinoStream.apk" --repo "$GITHUB_REPOSITORY" --clobber
            }
